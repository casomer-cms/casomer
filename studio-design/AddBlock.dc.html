<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Sora', system-ui, sans-serif; }
    a { color: #CE8A28; } a:hover { color: #9A6A12; }
  </style>
</helmet>
<div style="width: 860px; height: 420px; background: #E9E6DE; color: #1A1D28; box-sizing: border-box; padding: 30px; display: flex; justify-content: center; overflow: hidden;">
  <div style="width: 720px; background: #FFFFFF; border-radius: 10px; box-shadow: 0 2px 16px rgba(26,29,40,0.08); padding: 28px 36px; box-sizing: border-box;">

    <div style="border-radius: 8px; border: 1px solid #F1EEE7; overflow: hidden;">
      <div style="height: 70px; background: #F3E3C6; display: flex; align-items: center; justify-content: center;"><svg width="26" height="21" viewBox="0 0 40 32" fill="none" style="opacity: 0.7;"><rect x="1" y="1" width="38" height="30" rx="3" stroke="#CBB57E" stroke-width="2"></rect><circle cx="12" cy="11" r="3" stroke="#CBB57E" stroke-width="2"></circle><path d="M6 26l9-9 6 6 5-5 8 8" stroke="#CBB57E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
      <div style="padding: 12px 16px;">
        <div style="font-size: 14px; font-weight: 600;">Our sourdough story</div>
        <div style="font-size: 11.5px; color: #4B4F5C; margin-top: 3px;">Every loaf starts three days early.</div>
      </div>
    </div>

    <div style="position: relative; height: 26px; display: flex; align-items: center;">
      <div style="flex: 1; height: 2px; background: #E8A13D; border-radius: 1px;"></div>
      <div style="position: absolute; left: 50%; transform: translateX(-50%); width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; border: 1.5px solid #E8A13D; box-shadow: 0 1px 4px rgba(26,29,40,0.14); display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="#CE8A28" stroke-width="1.7" stroke-linecap="round"></path></svg>
      </div>
    </div>

    <div>
      <div style="font-size: 14px; font-weight: 600; margin-bottom: 5px;">Visit the bakery</div>
      <div style="font-size: 12px; color: #4B4F5C; line-height: 1.65;">We are on the corner of 5th and Alder, two blocks from the park. Street parking is easy before 9am.</div>
    </div>

    <div style="margin-top: 20px; border: 1px dashed #CDC8BB; border-radius: 8px; height: 62px; display: flex; align-items: center; justify-content: center; gap: 7px; color: #ABADB5;">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="#ABADB5" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <span style="font-size: 12px;">Add</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
