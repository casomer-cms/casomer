    <script>
        /* Theme, before first paint: an explicit stored choice wins,
           otherwise the OS preference. Synchronous on purpose so even
           the boot veil paints in the right voice. */
        ( () =>
        {
            let stored = null;

            try { stored = localStorage.getItem( 'studio-theme' ); } catch { /* storage blocked: follow the OS */ }

            const dark = stored === 'dark' || ( stored !== 'light' && matchMedia( '(prefers-color-scheme: dark)' ).matches );

            if ( dark ) { document.documentElement.dataset.theme = 'dark'; }
        } )();
    </script>

    <style>
        /* Outside the Tailwind block on purpose: the browser compiler
           recompiles that sheet as new classes appear, and fonts must
           never re-declare with it. */
        /* The LIGHT tokens, restated in plain CSS. The Tailwind
           browser compiler only emits the @theme variables its own
           utilities reference - anything used solely from plain CSS
           or arbitrary values (the focus halo, the shadow set, the
           flash) silently resolves to nothing without this block.
           Same values as @theme above; edit both together until a
           build step derives one from the other. */
        :root {
            --color-shell: #E9E6DE;
            --color-well: #F4F2EB;
            --color-surface: #FFFFFF;
            --color-input: #FBFAF7;
            --color-control: #DDD9CE;
            --color-control-soft: #EFECE4;

            --color-muted: #7D808B;
            --color-faint: #ABADB5;

            --color-shell-soft: #B6B1A4;
            --color-shell-strong: #716E62;
            --color-amber: #E8A13D;
            --color-amber-deep: #CE8A28;
            --color-amber-text: #9A6A12;
            --color-amber-wash: #FBF1DE;
            --color-amber-soft: #EDD9B4;
            --color-plate: #F3E3C6;
            --color-media-backdrop: transparent;
            --color-glyph: #CBB57E;
            --color-hairline: #F1EEE7;
            --color-hairline-cap: #EBE8DF;
            --color-border-std: #E3DFD5;
            --color-rule: #DDD9CE;
            --color-border-strong: #CDC8BB;
            --color-danger: #B5504A;
            --color-success: #3E8E63;
            --color-on-amber: #1A1D28;
            --color-veil: rgba(20, 22, 29, 0.45);
            --color-focus-halo: rgba(232, 161, 61, 0.25);
            --shadow-hairline: 0 1px 2px rgba(26, 29, 40, 0.06);
            --shadow-soft: 0 1px 8px rgba(26, 29, 40, 0.05);
            --shadow-edge: 0 3px 8px rgba(26, 29, 40, 0.07);
            --shadow-card: 0 2px 18px rgba(26, 29, 40, 0.06);
            --shadow-raised: 0 2px 12px rgba(26, 29, 40, 0.08);
            --shadow-chip: 0 1px 4px rgba(26, 29, 40, 0.14);
            --shadow-hover: 0 6px 28px rgba(26, 29, 40, 0.14);
            --shadow-pop: 0 8px 32px rgba(26, 29, 40, 0.16);
            --shadow-float: 0 10px 36px rgba(26, 29, 40, 0.2);
            --shadow-drag: 0 10px 28px rgba(26, 29, 40, 0.22);
            --shadow-modal: 0 12px 48px rgba(20, 22, 29, 0.35);
        }

        /* Dark chrome: every token above re-voiced, same names. Plain
           CSS on purpose - it needs no compiler, so a dark boot veil
           is dark from the first paint. It also outranks the compiled
           :root block (attribute selector, later in the document). */
        html[data-theme='dark'] {
            /* BRAND "Dark chrome": chrome-only dark - the site on
               canvas stays light, so paper holds its light value.
               Amber holds unchanged; grays are the BRAND ink family.
               The elevation ladder climbs a FULL tier per level
               (Mikey: raised pieces were barely lighter than the
               shell) - shell #101218, panels #1A1D28, cards #232734 -
               mirroring the light theme's shell/well/white contrast. */
            --color-shell: #1A1D28;
            --color-well: #232734;
            --color-surface: #2D3342;
            --color-input: #232734;
            --color-control: #2D3342;
            --color-control-soft: #293040;
            --color-control-hover: #3F4757;
            --color-button: #3A4150;
            --color-track: rgba(0, 0, 0, 0.25);
            --color-highlight: #3F4046;
            --color-paper: #F7F5F0;
            --color-ink: #F7F5F0;
            --color-text2: #C3C3C3;
            --color-muted: #8F929C;
            --color-faint: #62656F;
            --color-shell-muted: #8F929C;
            --color-shell-faint: #62656F;
            --color-shell-soft: #4A4D57;
            --color-shell-strong: #C3C3C3;
            --color-amber: #E8A13D;
            --color-amber-deep: #CE8A28;
            --color-amber-text: #D5A959;
            --color-amber-wash: #3F4046;
            --color-amber-soft: #54555B;
            --color-plate: #474850;
            --color-media-backdrop: transparent;
            --color-glyph: #ADA284;
            --color-hairline: #3A4150;
            --color-hairline-cap: #3F4757;
            --color-border-std: #444D5F;
            --color-rule: #4A5468;
            --color-border-strong: #576274;
            --color-danger: #CD6B64;
            --color-success: #57A97B;
            --color-on-amber: #1A1D28;
            --color-veil: rgba(0, 0, 0, 0.55);
            --color-focus-halo: rgba(232, 161, 61, 0.3);
            --shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.25);
            --shadow-soft: 0 1px 8px rgba(0, 0, 0, 0.22);
            --shadow-edge: 0 3px 8px rgba(0, 0, 0, 0.30);
            --shadow-card: 0 2px 18px rgba(0, 0, 0, 0.25);
            --shadow-raised: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-chip: 0 1px 4px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 6px 28px rgba(0, 0, 0, 0.4);
            --shadow-pop: 0 8px 32px rgba(0, 0, 0, 0.45);
            --shadow-float: 0 10px 36px rgba(0, 0, 0, 0.5);
            --shadow-drag: 0 10px 28px rgba(0, 0, 0, 0.5);
            --shadow-modal: 0 12px 48px rgba(0, 0, 0, 0.6);
            color-scheme: dark;
        }

        .sort-drag-clone {
            opacity: 1 !important;
            background: var(--color-surface);
            border-radius: 10px;
            box-shadow: var(--shadow-drag);
            cursor: grabbing;
        }

        .sort-drag-clone, .sort-drag-clone * {
            user-select: none;
        }

        /* Nothing on the page selects while a drag is on (Mikey): the
           plugin marks <body> for the duration. */
        body.sorting, body.sorting * {
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        .sort-family-hidden {
            display: none;
        }

        /* A family in flight: the clone stacks the parent row over its
           collapsed descendants. Sortable's inline height (measured
           off the parent row alone) yields to the stack. */
        .sort-family-clone {
            display: block;
            padding: 0 !important;
            height: auto !important;
        }

        /* A table row in flight rides inside its own small table so
           the cells keep their columns off the body. */
        .sort-clone-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        /* Jump-link landing flash: the amber wash blooms behind the
           row a usage jump points at - label, input, and note as one
           area - then settles away. Painted by an overlay pseudo so
           it reaches past the inspector's side padding (Mikey:
           full-width) without shifting layout, and isolated so it
           stays above the panel's own background. */
        .cs-jump-flash {
            position: relative;
            isolation: isolate;
        }

        .cs-jump-flash::before {
            content: '';
            position: absolute;
            inset: -8px -18px;
            z-index: -1;
            background: var(--color-amber-soft);
            animation: cs-jump-flash 2.6s ease-in-out forwards;
            pointer-events: none;
        }

        /* The pulse swings between two amber tones - opacity alone
           is imperceptible on a wash this pale - then fades. */
        @keyframes cs-jump-flash {
            0% { background: var(--color-amber-soft); opacity: 1; }
            22% { background: var(--color-amber-wash); opacity: 1; }
            44% { background: var(--color-amber-soft); opacity: 1; }
            66% { background: var(--color-amber-wash); opacity: 1; }
            82% { background: var(--color-amber-soft); opacity: 1; }
            100% { background: var(--color-amber-soft); opacity: 0; }
        }

        @keyframes cs-jump-flash-still {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cs-jump-flash::before {
                animation: cs-jump-flash-still 0.8s ease forwards;
            }
        }

        /* ---- Sortable lists in flight (UI.md section 1) ----------
           Every [data-sort-list] (fields, terms, entries, the menu
           tree) shares this treatment; [data-sort-card] is the list's
           card and [data-sort-header] the card's header when it has
           one. These rules are unlayered, so they beat Tailwind's
           layered utilities on the rows outright.

           The drop slot is the row Sortable walks through the list,
           as an ABSENCE (Mikey): the center pane's color shows
           through the card, the rows on either side of the gap wear
           card edges, so the list reads as two cards with the dragged
           item lifted out from between them. The slot's content hides
           (the clone on the cursor already shows it - two copies read
           as a double) and an amber dashed outline marks the gap, its
           left edge on the landing indent for the menu tree
           (--slot-inset; other lists take the default). The pane
           color bleeds one corner radius past the slot's box under
           the edge rows (--bleed-top / --bleed-bottom, set by the
           preview only where an edge row exists). The slot does not
           animate: Sortable animates every child with transforms, and
           letting the cut-out and a solid edge row slide past each
           other left a sliver of the gap on the far side of the row
           mid-animation; pinned, the gap opens as the rows slide away.
           A family's slot keeps the family's height, set inline. */
        .sort-drop-slot {
            position: relative;
            z-index: 0;
            border-color: transparent;
            transform: none !important;
            transition: none !important;
        }

        .sort-drop-slot > * {
            visibility: hidden;
        }

        .sort-drop-slot::after {
            content: '';
            position: absolute;
            z-index: -1;
            top: var(--bleed-top, 0);
            right: 0;
            bottom: var(--bleed-bottom, 0);
            left: 0;
            background: var(--color-well);
        }

        .sort-drop-slot::before {
            content: '';
            position: absolute;
            top: 5px;
            right: 10px;
            bottom: 5px;
            left: var(--slot-inset, 10px);
            border: 1.5px dashed var(--color-amber);
            border-radius: 8px;
            pointer-events: none;
            transition: opacity 220ms ease;
        }

        /* While the islands settle after a slot jump the outline is
           gone, then it fades back (Mikey). The settling class rides
           the echo's timer. */
        .sort-drop-slot.sort-slot-settling::before {
            opacity: 0;
            transition: none;
        }

        /* While an item is lifted, the rows slide OVER the gap, never
           through it: every row (and the card header) is a solid tile
           above the slot. The tile is a ::after pseudo, not the row's
           own background: Sortable writes an inline transition onto
           every row it slides, which would cancel a transition on the
           row itself, and the corners and shadow must ease between
           island and square states (Mikey). The pseudo overlaps the
           row's own hairline border (it paints above it), so it
           redraws the hairline itself, and the element's own straight
           border goes transparent (it showed through the tile's
           rounded corners). The card goes overflow-visible for the
           drag so the bottom island's shadow can fall past the card's
           edge (Mikey); the header tile and the last row carry the
           card's corner radii so nothing square shows there. The
           header sits above the row tiles: the first row's tile
           reaches one pixel up and at equal z painted over the
           header's hairline. */
        [data-sort-card]:has(.sort-drop-slot) {
            overflow: visible;
        }

        [data-sort-card]:has(.sort-drop-slot) [data-sort-header],
        [data-sort-list]:has(.sort-drop-slot) > [data-sort-id]:not(.sort-drop-slot) {
            position: relative;
            z-index: 1;
            border-color: transparent;
        }

        [data-sort-card]:has(.sort-drop-slot) [data-sort-header]::after,
        [data-sort-list]:has(.sort-drop-slot) > [data-sort-id]:not(.sort-drop-slot)::after {
            content: '';
            position: absolute;
            inset: -1px 0 0 0;
            z-index: -1;
            background: var(--color-surface);
            border-top: 1px solid transparent;
            transition: border-radius 220ms ease, box-shadow 220ms ease;
        }

        [data-sort-list]:has(.sort-drop-slot) > [data-sort-id].border-t::after {
            border-top-color: var(--color-hairline);
        }

        [data-sort-list]:has(.sort-drop-slot) > .bg-highlight::after {
            background: var(--color-highlight);
        }

        [data-sort-card]:has(.sort-drop-slot) [data-sort-header] {
            z-index: 2;
        }

        [data-sort-card]:has(.sort-drop-slot) [data-sort-header]::after {
            inset: 0 0 -1px 0;
            border-top: 0;
            border-bottom: 1px solid var(--color-hairline);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        /* The header as the upper island (slot first): its shadow,
           its hairline kept, and FLAT bottom corners (Mikey) - a
           header alone is not a card. */
        [data-sort-card]:has(.sort-drop-slot) [data-sort-header].sort-island-bottom::after {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        /* Outranks the hairline rule above for the lower island's
           top row (same specificity, later wins). */
        [data-sort-list]:has(.sort-drop-slot) > [data-sort-id].sort-island-top::after {
            border-top-color: transparent;
        }

        /* The echo: when the slot jumps, its old spot would snap back
           to card surface a beat before the incoming row slides into
           it (Mikey: "light gray suddenly appears"). A pane-colored
           echo sits at the old spot under the rows for the length of
           the slide, so the arriving solid row covers it as it lands,
           then the echo goes. Positioned against the list. */
        [data-sort-list] {
            position: relative;
        }

        .sort-slot-echo {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 0;
            background: var(--color-well);
            pointer-events: none;
        }

        /* The card's own shadow fades out while something is lifted
           and returns on the drop (Mikey). */
        [data-sort-card] {
            transition: box-shadow 220ms ease;
        }

        [data-sort-card]:has(.sort-drop-slot) {
            box-shadow: 0 0 0 0 transparent;
        }

        /* Island edges: the bottom row of each island (the row above
           the gap, the last row of the list, or the card header when
           the slot sits first) wears the card's bottom corners and
           its drop shadow; the top row of the lower island wears the
           top corners. Both ease in and out on the tile. */
        .sort-island-bottom::after {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            border-bottom-color: transparent;
            box-shadow: var(--shadow-edge);
        }

        .sort-island-top::after {
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border-top-color: transparent;
        }

        /* A list of one row has nothing to reorder: no grip (Mikey).
           The drag itself is refused in sortConfig's filter. */
        [data-sort-list]:has([data-sort-id]:only-of-type) [data-sort-grip] {
            display: none;
        }

        button svg, [role='button'] svg {
            display: block;
            transform: translateY(-0.5px);
        }

        @font-face {
            font-family: 'Sora';
            src: url('./assets/sora-latin.woff2') format('woff2');
            font-weight: 100 800;
            font-style: normal;
            font-display: swap;
        }

        [x-cloak] { display: none !important; }

        /* The boot veil, on the blindmikey-site pattern: plain CSS and
           visible by default, so it needs neither Alpine nor the
           Tailwind compiler to appear - it masks the whole boot, and
           the chrome only flips it to done. The o-mark spins per the
           BRAND motion rules; reduced motion holds it still. */
        .bootVeil {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: grid;
            place-content: center;
            /* The literal is the pre-compiler fallback: the compiled
               sheet defines --color-shell later; the dark block above
               defines it immediately. */
            background: var(--color-shell, #E9E6DE);
            transition: opacity 0.45s ease;
        }

        .bootVeil[data-state='done'] {
            opacity: 0;
            pointer-events: none;
        }

        .bootVeil img {
            width: 36px;
            height: 36px;
            animation: bootSpin 1.4s linear infinite;
        }

        @keyframes bootSpin {
            to { rotate: 360deg; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bootVeil img { animation: none; }
        }

        /* The brand wears its dark-background variant on dark chrome
           (BRAND: paper letterforms on dark). Pure CSS, so the boot
           veil's mark is right from the first paint and the toggle
           swaps instantly. */
        html[data-theme='dark'] .casomer-brand-light {
            display: none;
        }

        html:not([data-theme='dark']) .casomer-brand-dark {
            display: none;
        }

        /* Branded scrollbars: a quiet rounded thumb in shell tones,
           no track, riding the container's true edge. */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--color-border-strong, #CDC8BB) transparent;
        }

        *::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }

        /* The focus ring (BRAND: 2px amber, then a 3px soft amber
           halo BEYOND it - the shadow spreads 5px so the full halo
           shows past the outline). Amber is the only saturated voice,
           reserved for the primary action, the active selection, and
           focus. :focus-visible on buttons so mouse clicks stay quiet
           and keyboards always see it. */
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--color-amber);
            outline-offset: 0;
            box-shadow: 0 0 0 5px var(--color-focus-halo);
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 2px solid var(--color-amber);
            outline-offset: 0;
            box-shadow: 0 0 0 5px var(--color-focus-halo);
        }

        *::-webkit-scrollbar-thumb {
            background: var(--color-border-strong);
            border-radius: 5px;
            border: 3px solid transparent;
            background-clip: content-box;
        }

        *::-webkit-scrollbar-thumb:hover {
            background: var(--color-shell-faint);
            border: 3px solid transparent;
            background-clip: content-box;
        }
    </style>

    <script defer src="/vendor/alpine.js"></script>

<body x-data="studio" class="m-0 flex h-screen flex-col bg-shell font-sans text-ink" @keydown.escape.window="escapePressed()" @keydown.delete.window="deletePressed( $event )" @keydown.ctrl.k.window.prevent="togglePalette()" @keydown.meta.k.window.prevent="togglePalette()">

    <div class="bootVeil" :data-state="booting ? 'loading' : 'done'">
        <img class="casomer-brand-light" src="./assets/casomer-mark.svg" alt="">
        <img class="casomer-brand-dark" src="./assets/casomer-mark-dark.svg" alt="">
    </div>

    <template id="tpl-field-row">
        <div>
            <div class="mb-[5px] flex items-center">
                <label class="text-[11.5px] font-semibold leading-[15px] text-text2" x-text="field.label"></label>
                <span class="ml-1 text-[11.5px] leading-[15px] text-amber-text" x-show="field.required">*</span>
                <span class="flex-1"></span>
                <svg x-show="isBound && !showBindControl" width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5l3-3M5 11l-1.2 1.2a2.3 2.3 0 0 1-3.2-3.2L2.8 6.8M11 5l1.2-1.2a2.3 2.3 0 0 1 3.2 3.2L13.2 9.2" class="stroke-amber-deep" stroke-width="1.4" stroke-linecap="round"></path></svg>
                <template x-if="showBindControl">

                <div class="fixed inset-0 z-50 flex items-center justify-center bg-veil" @click.self="closeNavCreate()">
                    <div class="box-border w-[460px] rounded-xl bg-surface px-7 py-[26px] shadow-[var(--shadow-modal)]" @keydown.escape.stop="closeNavCreate()">
                        <div class="text-[17px] font-semibold" x-text="$t( navCreate === 'collection' ? 'createCollectionTitle' : ( navCreate === 'menu' ? 'createMenuTitle' : ( navCreate === 'partial' ? 'createPartialTitle' : ( navCreate === 'template' ? 'createTemplateTitle' : ( navCreate === 'layout' ? 'createLayoutTitle' : 'createTaxonomyTitle' ) ) ) ) )"></div>
                        <div class="mt-[3px] text-[12px] text-muted" x-text="$t( navCreate === 'collection' ? 'createCollectionSub' : ( navCreate === 'menu' ? 'createMenuSub' : ( navCreate === 'partial' ? 'createPartialSub' : ( navCreate === 'template' ? 'createTemplateSub' : ( navCreate === 'layout' ? 'createLayoutSub' : 'createTaxonomySub' ) ) ) ) )"></div>

                        <div class="mt-5">
                            <div class="mb-[5px]">
                                <label class="text-[11.5px] font-semibold leading-[15px] text-text2" x-text="$t( 'createNameLabel' )"></label><span class="ml-1 text-[11.5px] leading-[15px] text-amber-text">*</span>
                            </div>
                            <input
                                type="text"
                                class="box-border h-[34px] w-full rounded-[9px] border-0 bg-well px-3 font-sans text-[13px]"
                                :placeholder="$t( navCreate === 'collection' ? 'newCollectionName' : ( navCreate === 'menu' ? 'newMenuName' : ( navCreate === 'partial' ? 'newPartialName' : ( navCreate === 'template' ? 'newTemplateName' : ( navCreate === 'layout' ? 'newLayoutName' : 'newTaxonomyName' ) ) ) ) )"
                                x-model="navCreateLabel"
                                @input="navCreateError = ''"
                                @keydown.enter="submitNavCreate()"
                                x-init="$el.focus()"
                            >
                            <div class="mt-[5px] text-[11px] text-faint" x-text="navCreateSavedAs"></div>
                            <div class="mt-[5px] text-[11px] text-danger" x-show="navCreateError !== ''" x-text="navCreateError"></div>
                        </div>

                        <div class="mt-[18px] rounded-lg border border-border-std px-3.5 py-[13px]" x-show="navCreate !== 'menu' && navCreate !== 'partial' && navCreate !== 'template'">
                            <div class="flex items-center">
                                <span class="text-[13px] font-semibold" x-text="$t( 'createPublicIndex' )"></span>
                                <span class="flex-1"></span>
                                <button type="button" class="relative h-5 w-[34px] flex-none cursor-pointer rounded-full border-0 p-0" :class="navCreateIndex ? 'bg-amber' : 'bg-rule'" role="switch" :aria-checked="navCreateIndex" @click="navCreateIndex = !navCreateIndex">
                                    <span class="absolute top-[2px] h-4 w-4 rounded-full bg-surface shadow transition-all" :class="navCreateIndex ? 'left-4' : 'left-[2px]'"></span>
                                </button>
                            </div>
                            <div class="mt-1 text-[11.5px] leading-relaxed text-muted" x-text="navCreateIndexNote"></div>
                        </div>

                        <template x-if="navCreate === 'taxonomy'">
                            <div class="mt-2.5 rounded-lg border border-border-std px-3.5 py-[13px]">
                                <div class="flex items-center">
                                    <span class="text-[13px] font-semibold" x-text="$t( 'hierarchicalLabel' )"></span>
                                    <span class="flex-1"></span>
                                    <button type="button" class="relative h-5 w-[34px] flex-none cursor-pointer rounded-full border-0 p-0" :class="navCreateHierarchical ? 'bg-amber' : 'bg-rule'" role="switch" :aria-checked="navCreateHierarchical" @click="navCreateHierarchical = !navCreateHierarchical">
                                        <span class="absolute top-[2px] h-4 w-4 rounded-full bg-surface shadow transition-all" :class="navCreateHierarchical ? 'left-4' : 'left-[2px]'"></span>
                                    </button>
                                </div>
                                <div class="mt-1 text-[11.5px] leading-relaxed text-muted" x-text="$t( 'hierarchicalNote' )"></div>
                            </div>
                        </template>

                        <div class="mt-[22px] flex items-center">
                            <div class="mr-3 min-w-0 text-[11px] text-faint" x-show="navCreate === 'collection'" x-text="$t( 'createFieldsNext' )"></div>
                            <div class="flex-1"></div>
                            <button type="button" class="mr-2.5 flex-none cursor-pointer whitespace-nowrap rounded-lg border border-border-strong bg-button px-4 py-2 font-sans text-[13px] text-text2" x-text="$t( 'cancel' )" @click="closeNavCreate()"></button>
                            <button type="button" class="flex-none cursor-pointer whitespace-nowrap rounded-lg border-0 bg-amber px-[18px] py-2 font-sans text-[13px] font-semibold text-on-amber transition-colors duration-100 hover:bg-amber-deep" x-text="$t( navCreate === 'collection' ? 'createConfirm' : ( navCreate === 'menu' ? 'createConfirmMenu' : ( navCreate === 'partial' ? 'createConfirmPartial' : ( navCreate === 'template' ? 'createConfirmTemplate' : ( navCreate === 'layout' ? 'createConfirmLayout' : 'createConfirmTaxonomy' ) ) ) ) )" @click="submitNavCreate()"></button>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="confirmTarget !== null">
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-veil" @click.self="confirmTarget = null">
                    <div class="w-[460px] overflow-hidden rounded-[14px] bg-surface shadow-[var(--shadow-pop)]" @keydown.escape.stop="confirmTarget = null">
                        <div class="px-[22px] pb-1 pt-[18px]">
                            <div class="text-[15px] font-semibold" x-text="confirmQuestion"></div>
                            <div class="mt-1 text-[12px] text-muted" x-text="confirmDetail"></div>
                        </div>
                        <div class="flex items-center px-[22px] pb-[18px] pt-4">
                            <div class="flex-1"></div>
                            <button type="button" class="mr-2.5 flex-none cursor-pointer whitespace-nowrap rounded-[9px] border border-border-strong bg-button px-4 py-2 font-sans text-[12.5px] text-text2" x-text="$t( 'cancel' )" @click="cancelConfirm()"></button>
                            <button type="button" class="flex-none cursor-pointer whitespace-nowrap rounded-[9px] border-0 bg-danger px-[18px] py-2 font-sans text-[12.5px] font-semibold text-surface" x-text="confirmActionLabel" @click="runConfirmedDelete()"></button>
                        </div>
                        <div class="border-t border-hairline bg-input px-[22px] pb-3.5 pt-[11px]">
                            <div class="text-[10.5px] leading-[1.7] text-muted" x-text="$t( confirmTarget === 'mediaForever' ? 'deleteNoteForever' : 'deleteNote' )"></div>
                        </div>
                    </div>
                </div>
            </template>
        </aside>
    </div>
</body>
</html>
