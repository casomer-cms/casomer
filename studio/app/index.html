<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>casomer studio</title>
    <link rel="icon" href="./assets/casomer-mark.svg">
    <script>
        /* Theme, before first paint: an explicit stored choice wins,
           otherwise the OS preference. Synchronous on purpose so even
           the boot veil paints in the right voice. */
        ( () =>
        {
            let stored = null;

            try { stored = localStorage.getItem( 'studio-theme' ); } catch { /* storage blocked: follow the OS */ }

            const dark = stored === 'dark' || ( stored !== 'light' && matchMedia( '(prefers-color-scheme: dark)' ).matches );

            if ( dark ) { document.documentElement.dataset.theme = 'dark'; }
        } )();
    </script>
    <script src="/vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-shell: #E9E6DE;
            --color-well: #F4F2EB;
            --color-surface: #FFFFFF;
            --color-input: #FBFAF7;
            --color-control: #DDD9CE;
            --color-control-soft: #EFECE4;
            --color-control-hover: #FFFFFF;
            --color-paper: #F7F5F0;
            --color-ink: #1A1D28;
            --color-text2: #4B4F5C;
            --color-muted: #7D808B;
            --color-faint: #ABADB5;
            --color-shell-muted: #8A8677;
            --color-shell-faint: #A39E8F;
            --color-shell-soft: #B6B1A4;
            --color-shell-strong: #716E62;
            --color-amber: #E8A13D;
            --color-amber-deep: #CE8A28;
            --color-amber-text: #9A6A12;
            --color-amber-wash: #FBF1DE;
            --color-amber-soft: #EDD9B4;
            --color-plate: #F3E3C6;
            --color-glyph: #CBB57E;
            --color-hairline: #F1EEE7;
            --color-hairline-cap: #EBE8DF;
            --color-border-std: #E3DFD5;
            --color-rule: #DDD9CE;
            --color-border-strong: #CDC8BB;
            --color-danger: #B5504A;
            --color-success: #3E8E63;
            --color-on-amber: #1A1D28;
            --color-veil: rgba(20, 22, 29, 0.45);
            --color-focus-halo: rgba(232, 161, 61, 0.25);
            --shadow-hairline: 0 1px 2px rgba(26, 29, 40, 0.06);
            --shadow-soft: 0 1px 8px rgba(26, 29, 40, 0.05);
            --shadow-card: 0 2px 18px rgba(26, 29, 40, 0.06);
            --shadow-raised: 0 2px 12px rgba(26, 29, 40, 0.08);
            --shadow-chip: 0 1px 4px rgba(26, 29, 40, 0.14);
            --shadow-hover: 0 6px 28px rgba(26, 29, 40, 0.14);
            --shadow-pop: 0 8px 32px rgba(26, 29, 40, 0.16);
            --shadow-float: 0 10px 36px rgba(26, 29, 40, 0.2);
            --shadow-drag: 0 10px 28px rgba(26, 29, 40, 0.22);
            --shadow-modal: 0 12px 48px rgba(20, 22, 29, 0.35);
            --font-sans: Sora, system-ui, sans-serif;
            --ease-settle: cubic-bezier(0.2, 0, 0, 1);
        }

    </style>
    <style>
        /* Outside the Tailwind block on purpose: the browser compiler
           recompiles that sheet as new classes appear, and fonts must
           never re-declare with it. */
        /* The LIGHT tokens, restated in plain CSS. The Tailwind
           browser compiler only emits the @theme variables its own
           utilities reference - anything used solely from plain CSS
           or arbitrary values (the focus halo, the shadow set, the
           flash) silently resolves to nothing without this block.
           Same values as @theme above; edit both together until a
           build step derives one from the other. */
        :root {
            --color-shell: #E9E6DE;
            --color-well: #F4F2EB;
            --color-surface: #FFFFFF;
            --color-input: #FBFAF7;
            --color-control: #DDD9CE;
            --color-control-soft: #EFECE4;
            --color-control-hover: #FFFFFF;
            --color-paper: #F7F5F0;
            --color-ink: #1A1D28;
            --color-text2: #4B4F5C;
            --color-muted: #7D808B;
            --color-faint: #ABADB5;
            --color-shell-muted: #8A8677;
            --color-shell-faint: #A39E8F;
            --color-shell-soft: #B6B1A4;
            --color-shell-strong: #716E62;
            --color-amber: #E8A13D;
            --color-amber-deep: #CE8A28;
            --color-amber-text: #9A6A12;
            --color-amber-wash: #FBF1DE;
            --color-amber-soft: #EDD9B4;
            --color-plate: #F3E3C6;
            --color-glyph: #CBB57E;
            --color-hairline: #F1EEE7;
            --color-hairline-cap: #EBE8DF;
            --color-border-std: #E3DFD5;
            --color-rule: #DDD9CE;
            --color-border-strong: #CDC8BB;
            --color-danger: #B5504A;
            --color-success: #3E8E63;
            --color-on-amber: #1A1D28;
            --color-veil: rgba(20, 22, 29, 0.45);
            --color-focus-halo: rgba(232, 161, 61, 0.25);
            --shadow-hairline: 0 1px 2px rgba(26, 29, 40, 0.06);
            --shadow-soft: 0 1px 8px rgba(26, 29, 40, 0.05);
            --shadow-card: 0 2px 18px rgba(26, 29, 40, 0.06);
            --shadow-raised: 0 2px 12px rgba(26, 29, 40, 0.08);
            --shadow-chip: 0 1px 4px rgba(26, 29, 40, 0.14);
            --shadow-hover: 0 6px 28px rgba(26, 29, 40, 0.14);
            --shadow-pop: 0 8px 32px rgba(26, 29, 40, 0.16);
            --shadow-float: 0 10px 36px rgba(26, 29, 40, 0.2);
            --shadow-drag: 0 10px 28px rgba(26, 29, 40, 0.22);
            --shadow-modal: 0 12px 48px rgba(20, 22, 29, 0.35);
        }

        /* Dark chrome: every token above re-voiced, same names. Plain
           CSS on purpose - it needs no compiler, so a dark boot veil
           is dark from the first paint. It also outranks the compiled
           :root block (attribute selector, later in the document). */
        html[data-theme='dark'] {
            /* BRAND "Dark chrome": chrome-only dark - the site on
               canvas stays light, so paper holds its light value.
               Amber holds unchanged; grays are the BRAND ink family;
               in-between steps interpolate within it. */
            --color-shell: #101218;
            --color-well: #101218;
            --color-surface: #1A1D28;
            --color-input: #232734;
            --color-control: #232734;
            --color-control-soft: #1F2330;
            --color-control-hover: #303542;
            --color-paper: #F7F5F0;
            --color-ink: #F7F5F0;
            --color-text2: #C3C3C3;
            --color-muted: #8F929C;
            --color-faint: #62656F;
            --color-shell-muted: #8F929C;
            --color-shell-faint: #62656F;
            --color-shell-soft: #4A4D57;
            --color-shell-strong: #C3C3C3;
            --color-amber: #E8A13D;
            --color-amber-deep: #CE8A28;
            --color-amber-text: #D89A3F;
            --color-amber-wash: #33291A;
            --color-amber-soft: #4A3B20;
            --color-plate: #2E2415;
            --color-glyph: #A08A55;
            --color-hairline: #232734;
            --color-hairline-cap: #2A2F3C;
            --color-border-std: #2E3340;
            --color-rule: #303542;
            --color-border-strong: #3D4352;
            --color-danger: #CD6B64;
            --color-success: #57A97B;
            --color-on-amber: #1A1D28;
            --color-veil: rgba(0, 0, 0, 0.55);
            --color-focus-halo: rgba(232, 161, 61, 0.3);
            --shadow-hairline: 0 1px 2px rgba(0, 0, 0, 0.25);
            --shadow-soft: 0 1px 8px rgba(0, 0, 0, 0.22);
            --shadow-card: 0 2px 18px rgba(0, 0, 0, 0.25);
            --shadow-raised: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-chip: 0 1px 4px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 6px 28px rgba(0, 0, 0, 0.4);
            --shadow-pop: 0 8px 32px rgba(0, 0, 0, 0.45);
            --shadow-float: 0 10px 36px rgba(0, 0, 0, 0.5);
            --shadow-drag: 0 10px 28px rgba(0, 0, 0, 0.5);
            --shadow-modal: 0 12px 48px rgba(0, 0, 0, 0.6);
            color-scheme: dark;
        }

        .sort-drag-clone {
            opacity: 1 !important;
            background: var(--color-surface);
            border-radius: 10px;
            box-shadow: var(--shadow-drag);
            cursor: grabbing;
        }

        .sort-drag-clone, .sort-drag-clone * {
            user-select: none;
        }

        .sort-family-hidden {
            display: none;
        }

        /* Jump-link landing flash: the amber wash blooms behind the
           row a usage jump points at - label, input, and note as one
           area - then settles away. Painted by an overlay pseudo so
           it reaches past the inspector's side padding (Mikey:
           full-width) without shifting layout, and isolated so it
           stays above the panel's own background. */
        .cs-jump-flash {
            position: relative;
            isolation: isolate;
        }

        .cs-jump-flash::before {
            content: '';
            position: absolute;
            inset: -8px -18px;
            z-index: -1;
            background: var(--color-amber-soft);
            animation: cs-jump-flash 2.6s ease-in-out forwards;
            pointer-events: none;
        }

        /* The pulse swings between two amber tones - opacity alone
           is imperceptible on a wash this pale - then fades. */
        @keyframes cs-jump-flash {
            0% { background: var(--color-amber-soft); opacity: 1; }
            22% { background: var(--color-amber-wash); opacity: 1; }
            44% { background: var(--color-amber-soft); opacity: 1; }
            66% { background: var(--color-amber-wash); opacity: 1; }
            82% { background: var(--color-amber-soft); opacity: 1; }
            100% { background: var(--color-amber-soft); opacity: 0; }
        }

        @keyframes cs-jump-flash-still {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cs-jump-flash::before {
                animation: cs-jump-flash-still 0.8s ease forwards;
            }
        }

        .sort-drop-slot {
            opacity: 0.35;
        }

        button svg, [role='button'] svg {
            display: block;
            transform: translateY(-0.5px);
        }

        @font-face {
            font-family: 'Sora';
            src: url('./assets/sora-latin.woff2') format('woff2');
            font-weight: 100 800;
            font-style: normal;
            font-display: swap;
        }

        [x-cloak] { display: none !important; }

        /* The boot veil, on the blindmikey-site pattern: plain CSS and
           visible by default, so it needs neither Alpine nor the
           Tailwind compiler to appear - it masks the whole boot, and
           the chrome only flips it to done. The o-mark spins per the
           BRAND motion rules; reduced motion holds it still. */
        .bootVeil {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: grid;
            place-content: center;
            /* The literal is the pre-compiler fallback: the compiled
               sheet defines --color-shell later; the dark block above
               defines it immediately. */
            background: var(--color-shell, #E9E6DE);
            transition: opacity 0.45s ease;
        }

        .bootVeil[data-state='done'] {
            opacity: 0;
            pointer-events: none;
        }

        .bootVeil img {
            width: 36px;
            height: 36px;
            animation: bootSpin 1.4s linear infinite;
        }

        @keyframes bootSpin {
            to { rotate: 360deg; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bootVeil img { animation: none; }
        }

        /* Branded scrollbars: a quiet rounded thumb in shell tones,
           no track, riding the container's true edge. */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--color-border-strong, #CDC8BB) transparent;
        }

        *::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }

        /* The focus ring (BRAND: 2px amber, then a 3px soft amber
           halo BEYOND it - the shadow spreads 5px so the full halo
           shows past the outline). Amber is the only saturated voice,
           reserved for the primary action, the active selection, and
           focus. :focus-visible on buttons so mouse clicks stay quiet
           and keyboards always see it. */
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--color-amber);
            outline-offset: 0;
            box-shadow: 0 0 0 5px var(--color-focus-halo);
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 2px solid var(--color-amber);
            outline-offset: 0;
            box-shadow: 0 0 0 5px var(--color-focus-halo);
        }

        *::-webkit-scrollbar-thumb {
            background: var(--color-border-strong);
            border-radius: 5px;
            border: 3px solid transparent;
            background-clip: content-box;
        }

        *::-webkit-scrollbar-thumb:hover {
            background: var(--color-shell-faint);
            border: 3px solid transparent;
            background-clip: content-box;
        }
    </style>
    <script type="module" src="./app.js"></script>
    <script defer src="/vendor/alpine-sort.js"></script>
    <script defer src="/vendor/alpine.js"></script>
</head>
<body x-data="studio" class="m-0 flex h-screen flex-col bg-shell font-sans text-ink" @keydown.escape.window="escapePressed()" @keydown.delete.window="deletePressed( $event )" @keydown.ctrl.k.window.prevent="togglePalette()" @keydown.meta.k.window.prevent="togglePalette()">

    <div class="bootVeil" :data-state="booting ? 'loading' : 'done'">
        <img src="./assets/casomer-mark.svg" alt="">
    </div>

    <template id="tpl-field-row">
        <div>
            <div class="mb-[5px] flex items-center">
                <label class="text-[11.5px] font-semibold leading-[15px] text-text2" x-text="field.label"></label>
                <span class="ml-1 text-[11.5px] leading-[15px] text-amber-text" x-show="field.required">*</span>
                <span class="flex-1"></span>
                <svg x-show="isBound && !showBindControl" width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5l3-3M5 11l-1.2 1.2a2.3 2.3 0 0 1-3.2-3.2L2.8 6.8M11 5l1.2-1.2a2.3 2.3 0 0 1 3.2 3.2L13.2 9.2" class="stroke-amber-deep" stroke-width="1.4" stroke-linecap="round"></path></svg>
                <template x-if="showBindControl">
                    <div class="relative flex" @click.outside="bindMenuOpen = false">
                        <button type="button" class="flex cursor-pointer border-0 bg-transparent p-0.5" :aria-label="$t( 'linkToField' )" @click="bindMenuOpen = !bindMenuOpen">
                            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5l3-3M5 11l-1.2 1.2a2.3 2.3 0 0 1-3.2-3.2L2.8 6.8M11 5l1.2-1.2a2.3 2.3 0 0 1 3.2 3.2L13.2 9.2" :class="isBound ? 'stroke-amber-deep' : 'stroke-shell-faint'" stroke-width="1.4" stroke-linecap="round"></path></svg>
                        </button>
                        <template x-if="bindMenuOpen">
                            <div class="absolute right-0 top-full z-20 mt-1 w-44 rounded-xl bg-surface p-1.5 shadow-[var(--shadow-float)]">
                                <button type="button" class="block w-full cursor-pointer truncate rounded-[7px] border-0 px-2.5 py-1.5 text-left font-sans text-[12px]" :class="!isBound ? 'bg-amber-wash font-semibold' : 'bg-transparent'" x-text="$t( 'notLinked' )" @click="setBinding( '' )"></button>
                                <template x-for="option in bindOptions" :key="option.key">
                                    <button type="button" class="block w-full cursor-pointer truncate rounded-[7px] border-0 px-2.5 py-1.5 text-left font-sans text-[12px]" :class="isBound && bindLabel === option.label ? 'bg-amber-wash font-semibold' : 'bg-transparent'" x-text="option.label" @click="setBinding( option.key )"></button>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <template x-if="isBound">
                <div class="box-border flex h-8 items-center gap-[7px] rounded-[9px] border border-amber-soft bg-amber-wash px-2.5">
                    <span class="text-[10px] font-semibold uppercase tracking-[0.06em] text-amber-text" x-text="$t( 'boundBadge' )"></span>
                    <span class="text-[12.5px]" x-text="bindLabel"></span>
                </div>
            </template>

            <template x-if="!isBound && ( field.type === 'text' || field.type === 'url' || field.type === 'email' )">
                <div>
                    <input type="text" class="box-border h-[34px] w-full rounded-[9px] border-0 bg-well px-3 font-sans text-[12.5px]" x-model="value" :placeholder="field.placeholder ?? ''">
                    <template x-for="problem in interpolationProblems" :key="problem">
                        <p class="m-0 mt-1 text-[11px] leading-relaxed text-amber-text" x-text="problem"></p>
                    </template>
                </div>
            </template>

            <template x-if="!isBound && ( field.type === 'markdown' || field.type === 'textarea' )">
                <div>
                    <textarea rows="9" class="box-border min-h-[192px] w-full resize-y rounded-[9px] border-0 bg-well p-3 font-sans text-[12.5px]" x-model="value"></textarea>
                    <template x-for="problem in interpolationProblems" :key="problem">
                        <p class="m-0 mt-1 text-[11px] leading-relaxed text-amber-text" x-text="problem"></p>
                    </template>
                    <p class="m-0 mt-1 text-[11px] leading-relaxed text-faint" x-show="bindable" x-text="interpolationHintLine"></p>
                </div>
            </template>

            <template x-if="field.type === 'number'">
                <input type="number" class="box-border h-[34px] w-full rounded-[9px] border-0 bg-well px-3 font-sans text-[12.5px]" x-model.number="value">
            </template>

            <template x-if="field.type === 'date'">
                <input type="date" class="box-border h-[34px] w-full rounded-[9px] border-0 bg-well px-3 font-sans text-[12.5px]" x-model="value">
            </template>

            <template x-if="field.type === 'color'">
                <div class="flex items-center gap-2.5">
                    <input type="color" class="h-8 w-10 cursor-pointer rounded-[7px] border border-border-std bg-surface p-0.5" x-model="value">
                    <span class="font-mono text-[11.5px] text-muted" x-text="value"></span>
                </div>
            </template>

            <template x-if="field.type === 'select'">
                <select class="box-border h-[34px] w-full rounded-[9px] border-0 bg-well px-2.5 font-sans text-[12.5px]" x-model="value">
                    <option value=""></option>
                    <template x-for="option in selectOptions" :key="option">
                        <option :value="option" x-text="option" :selected="option === value"></option>
                    </template>
                </select>
            </template>

            <template x-if="field.type === 'reference' && referenceMultiple">
                <div>
                    <div class="flex max-h-56 flex-col gap-1 overflow-y-auto rounded-[9px] bg-well p-2.5">
                        <template x-for="option in referenceOptions" :key="option.id">
                            <label class="flex cursor-pointer items-center gap-2 font-sans text-[12.5px]">
                                <input type="checkbox" class="h-3.5 w-3.5 accent-amber-deep" :checked="Array.isArray( value ) && value.includes( option.id )" @change="toggleReferenceValue( option.id )">
                                <span x-text="option.name"></span>
                            </label>
                        </template>
                        <p class="m-0 text-[11.5px] text-muted" x-show="referenceOptions.length === 0" x-text="$t( 'referenceNoOptions' )"></p>
                    </div>
                    <div class="mt-1.5" x-show="referenceTaxonomyFile !== null">
                        <button type="button" class="cursor-pointer border-0 bg-transparent p-0 font-sans text-[11.5px] font-semibold text-amber-deep" x-show="newTermDraft === null" x-text="$t( 'newTermWord' )" @click="startNewTerm()"></button>
                        <div class="flex items-center gap-1.5" x-show="newTermDraft !== null">
                            <input type="text" class="box-border h-7 min-w-0 flex-1 rounded-[7px] border-0 bg-well px-2 font-sans text-[12px]" :placeholder="$t( 'newTermPlaceholder' )" x-model="newTermDraft" x-ref="newTermInput" @keydown.enter.stop="createReferenceTerm( newTermDraft )" @keydown.escape.stop="newTermDraft = null">
                            <button type="button" class="flex-none cursor-pointer rounded-[7px] border-0 bg-amber px-2.5 py-1 font-sans text-[11px] font-semibold text-on-amber" x-text="$t( 'addWord' )" @click="createReferenceTerm( newTermDraft )"></button>
                        </div>
                    </div>
                </div>
            </template>
            <template x-if="field.type === 'reference' && !referenceMultiple && !referenceSearchable">
                <div>
                    <select class="box-border h-[34px] w-full rounded-[9px] border-0 bg-well px-2.5 font-sans text-[12.5px]" x-model="value">
                        <option value=""></option>
                        <template x-for="term in referenceOptions" :key="term.id">
                            <option :value="term.id" x-text="term.name" :selected="term.id === value"></option>
                        </template>
                    </select>
                    <div class="mt-1.5" x-show="referenceTaxonomyFile !== null">
                        <button type="button" class="cursor-pointer border-0 bg-transparent p-0 font-sans text-[11.5px] font-semibold text-amber-deep" x-show="newTermDraft === null" x-text="$t( 'newTermWord' )" @click="startNewTerm()"></button>
                        <div class="flex items-center gap-1.5" x-show="newTermDraft !== null">
                            <input type="text" class="box-border h-7 min-w-0 flex-1 rounded-[7px] border-0 bg-well px-2 font-sans text-[12px]" :placeholder="$t( 'newTermPlaceholder' )" x-model="newTermDraft" x-ref="newTermInput" @keydown.enter.stop="createReferenceTerm( newTermDraft )" @keydown.escape.stop="newTermDraft = null">
                            <button type="button" class="flex-none cursor-pointer rounded-[7px] border-0 bg-amber px-2.5 py-1 font-sans text-[11px] font-semibold text-on-amber" x-text="$t( 'addWord' )" @click="createReferenceTerm( newTermDraft )"></button>
                        </div>
                    </div>
                </div>
            </template>
            <template x-if="field.type === 'reference' && referenceSearchable">
                <div class="relative" @click.outside="refPickerOpen = false">
                    <input type="text" class="box-border h-[34px] w-full rounded-[9px] border-0 bg-well px-3 font-sans text-[12.5px] placeholder:text-text2" :placeholder="referenceValueLabel === '' ? $t( 'searchOptions' ) : referenceValueLabel" x-model="refQuery" @focus="refPickerOpen = true" @input="refPickerOpen = true">
                    <template x-if="refPickerOpen">
                        <div class="absolute inset-x-0 top-full z-20 mt-1 max-h-56 overflow-y-auto rounded-[9px] bg-surface p-1.5 shadow-[var(--shadow-float)]">
                            <button type="button" class="block w-full cursor-pointer truncate rounded-[7px] border-0 px-2.5 py-1.5 text-left font-sans text-[12px]" :class="value === '' ? 'bg-amber-wash font-semibold' : 'bg-transparent'" x-text="$t( 'notLinked' )" @click="pickReference( '' )"></button>
                            <template x-for="term in filteredReferenceOptions" :key="term.id">

                        </template>

                        <div class="mt-[22px] flex items-center">
                            <div class="mr-3 min-w-0 text-[11px] text-faint" x-show="navCreate === 'collection'" x-text="$t( 'createFieldsNext' )"></div>
                            <div class="flex-1"></div>
                            <button type="button" class="mr-2.5 flex-none cursor-pointer whitespace-nowrap rounded-lg border border-border-strong bg-surface px-4 py-2 font-sans text-[13px] text-text2" x-text="$t( 'cancel' )" @click="navCreate = null"></button>
                            <button type="button" class="flex-none cursor-pointer whitespace-nowrap rounded-lg border-0 bg-amber px-[18px] py-2 font-sans text-[13px] font-semibold text-on-amber transition-colors duration-100 hover:bg-amber-deep" x-text="$t( navCreate === 'collection' ? 'createConfirm' : ( navCreate === 'menu' ? 'createConfirmMenu' : ( navCreate === 'partial' ? 'createConfirmPartial' : 'createConfirmTaxonomy' ) ) )" @click="submitNavCreate()"></button>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="confirmTarget !== null">
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-veil" @click.self="confirmTarget = null">
                    <div class="w-[460px] overflow-hidden rounded-[14px] bg-surface shadow-[var(--shadow-pop)]" @keydown.escape.stop="confirmTarget = null">
                        <div class="px-[22px] pb-1 pt-[18px]">
                            <div class="text-[15px] font-semibold" x-text="confirmQuestion"></div>
                            <div class="mt-1 text-[12px] text-muted" x-text="confirmDetail"></div>
                        </div>
                        <div class="flex items-center px-[22px] pb-[18px] pt-4">
                            <div class="flex-1"></div>
                            <button type="button" class="mr-2.5 flex-none cursor-pointer whitespace-nowrap rounded-[9px] border border-border-strong bg-surface px-4 py-2 font-sans text-[12.5px] text-text2" x-text="$t( 'cancel' )" @click="cancelConfirm()"></button>
                            <button type="button" class="flex-none cursor-pointer whitespace-nowrap rounded-[9px] border-0 bg-danger px-[18px] py-2 font-sans text-[12.5px] font-semibold text-surface" x-text="confirmActionLabel" @click="runConfirmedDelete()"></button>
                        </div>
                        <div class="border-t border-hairline bg-input px-[22px] pb-3.5 pt-[11px]">
                            <div class="text-[10.5px] leading-[1.7] text-muted" x-text="$t( confirmTarget === 'mediaForever' ? 'deleteNoteForever' : 'deleteNote' )"></div>
                        </div>
                    </div>
                </div>
            </template>
        </aside>
    </div>
</body>
</html>
