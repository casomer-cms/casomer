<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Inspector, the Alpine lane</title>
    <link rel="stylesheet" href="./tailwind.css">
    <script type="module" src="./app.js"></script>
    <script defer src="./alpine.min.js"></script>
</head>
<body class="m-0 bg-well font-sans text-ink">

    <template id="tpl-field-row">
        <div>
            <div class="mb-[5px] flex items-center">
                <label class="text-[11.5px] leading-[15px] font-semibold text-text2" x-text="field.label"></label>
                <span class="ml-1 text-[11.5px] leading-[15px] text-amber-text" x-show="field.required">*</span>
            </div>

            <template x-if="field.type === 'text'">
                <input type="text" class="box-border h-8 w-full rounded-[9px] border border-border-std bg-input px-2.5 text-[12.5px] font-sans" x-model="value" :placeholder="field.placeholder ?? ''">
            </template>

            <template x-if="field.type === 'markdown' || field.type === 'textarea'">
                <textarea class="box-border min-h-[64px] w-full rounded-[9px] border border-border-std bg-input p-2.5 text-[12.5px] font-sans" x-model="value"></textarea>
            </template>

            <template x-if="field.type === 'select'">
                <select class="box-border h-8 w-full rounded-[9px] border border-border-std bg-input px-2 text-[12.5px] font-sans" x-model="value">
                    <option value=""></option>
                    <template x-for="option in selectOptions" :key="option">
                        <option :value="option" x-text="option" :selected="option === value"></option>
                    </template>
                </select>
            </template>

            <template x-if="field.type === 'toggle'">
                <button type="button" class="relative h-[18px] w-8 rounded-full border-0 p-0" :class="value ? 'bg-amber' : 'bg-rule'" role="switch" :aria-checked="value" @click="value = !value">
                    <span class="absolute top-[2px] h-[14px] w-[14px] rounded-full bg-surface shadow transition-all" :class="value ? 'left-[16px]' : 'left-[2px]'"></span>
                </button>
            </template>

            <template x-if="field.type === 'image'">
                <div class="flex h-16 items-center justify-center rounded-[9px] bg-plate">
                    <svg width="26" height="21" viewBox="0 0 40 32" fill="none" class="opacity-70"><rect x="1" y="1" width="38" height="30" rx="3" stroke="#CBB57E" stroke-width="2"></rect><circle cx="12" cy="11" r="3" stroke="#CBB57E" stroke-width="2"></circle><path d="M6 26l9-9 6 6 5-5 8 8" stroke="#CBB57E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </div>
            </template>

            <template x-if="field.type === 'list'">
                <div x-data="repeater" class="flex flex-col gap-2">
                    <template x-for="( item, index ) in value" :key="index">
                        <div x-data="repeaterItem( index )" class="rounded-[9px] border border-hairline">
                            <div class="flex items-center gap-2 rounded-t-[9px] bg-well px-2.5 py-1.5" :class="expanded ? '' : 'rounded-b-[9px]'">
                                <svg width="10" height="14" viewBox="0 0 10 14" fill="#A39E8F" class="shrink-0"><circle cx="3" cy="3" r="1.2"></circle><circle cx="7" cy="3" r="1.2"></circle><circle cx="3" cy="7" r="1.2"></circle><circle cx="7" cy="7" r="1.2"></circle><circle cx="3" cy="11" r="1.2"></circle><circle cx="7" cy="11" r="1.2"></circle></svg>
                                <span class="flex-1 truncate text-[12px] font-semibold" x-text="itemLabel"></span>
                                <button type="button" class="border-0 bg-transparent p-0 text-[11px] text-muted" @click="remove()">Remove</button>
                                <button type="button" class="border-0 bg-transparent p-0" @click="expanded = !expanded" :aria-expanded="expanded" aria-label="Toggle item">
                                    <svg width="11" height="11" viewBox="0 0 16 16" fill="none" :class="expanded ? 'rotate-180' : ''" class="transition-transform"><path d="M3.5 6L8 10.5L12.5 6" stroke="#8A8677" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                </button>
                            </div>
                            <template x-if="expanded">
                                <div class="flex flex-col gap-3 p-2.5">
                                    <template x-for="childKey in Object.keys( field.fields )" :key="childKey">
                                        <div x-data="fieldCtx( childKey, field.fields, item )" x-show="visible" x-component="tpl-field-row"></div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    <button type="button" class="self-start border-0 bg-transparent p-0 text-[12px] font-semibold text-amber-deep" @click="addItem()">+ Add item</button>
                </div>
            </template>

            <p class="mt-1 text-[11px] leading-relaxed text-muted" x-show="field.help !== undefined" x-text="field.help ?? ''"></p>
        </div>
    </template>

    <div x-data="inspector" x-effect="postPreview( JSON.stringify( props ) )" class="flex h-screen">
        <div class="box-border flex h-full w-[340px] shrink-0 flex-col gap-3 overflow-auto bg-surface p-[18px]">
        <template x-if="manifest !== null">
            <div class="flex flex-col gap-3">
                <div>
                    <div class="text-[15px] font-semibold leading-[20px]" x-text="manifest.title"></div>
                    <div class="mt-0.5 text-[11.5px] text-muted leading-[15px]" x-text="manifest.packageName + ' / ' + manifest.id"></div>
                </div>
                <div class="-mx-[18px] border-t border-rule"></div>
                <div class="flex gap-[18px] border-b border-hairline">
                    <button type="button" class="border-0 bg-transparent p-0 pb-2 text-[12.5px] leading-[16px]" :class="tab === 'content' ? 'font-semibold text-ink border-b-2 border-amber -mb-px' : 'text-muted'" @click="tab = 'content'">Content</button>
                    <button type="button" class="border-0 bg-transparent p-0 pb-2 text-[12.5px] leading-[16px]" :class="tab === 'settings' ? 'font-semibold text-ink border-b-2 border-amber -mb-px' : 'text-muted'" @click="tab = 'settings'">Settings</button>
                </div>

                <div class="flex flex-col gap-4" x-show="tab === 'content'">
                    <template x-for="key in fieldKeys" :key="key">
                        <div x-data="fieldCtx( key, manifest.fields, props )" x-show="visible" x-component="tpl-field-row"></div>
                    </template>
                </div>

                <div class="mt-2 border-t border-hairline pt-3">
                    <div class="mb-1 flex items-center text-[11px] text-muted">
                        <span>Written props</span>
                        <span class="flex-1"></span>
                        <span x-text="dirty + ' edits'"></span>
                    </div>
                    <pre class="m-0 max-h-48 overflow-auto rounded-[9px] bg-well p-2.5 text-[10.5px] leading-relaxed" x-text="json()"></pre>
                </div>
            </div>
        </template>
        </div>
        <iframe x-ref="preview" src="../preview/preview.html" class="h-full flex-1 border-0 bg-white" title="Preview" @load="postPreview( JSON.stringify( props ) )"></iframe>
    </div>
</body>
</html>
