<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Inspector bake-off</title>
    <style>
        body { margin: 0; font-family: Sora, system-ui, sans-serif; background: #E9E6DE; color: #1A1D28; }
        header { padding: 18px 24px 6px; }
        h1 { font-size: 16px; margin: 0; }
        p { font-size: 12px; color: #716E62; margin: 4px 0 0; }
        .lanes { display: flex; gap: 18px; padding: 14px 24px 24px; height: calc(100vh - 90px); box-sizing: border-box; }
        .lane { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .lane-title { font-size: 12px; font-weight: 600; color: #4B4F5C; }
        .lane-title a { margin-left: 8px; font-weight: 400; font-size: 11px; color: #CE8A28; text-decoration: none; }
        iframe { flex: 1; border: none; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 14px rgba(26,29,40,0.08); }
    </style>
</head>
<body>
    <header>
        <h1>Schema-generated inspector: Alpine vs Svelte</h1>
        <p>Same normalized card manifest, same behavior contract. Left: Alpine, no build step, x-component pattern, Tailwind. Right: Svelte 5, compiled.</p>
    </header>
    <div class="lanes">
        <div class="lane">
            <div class="lane-title">Alpine lane <a href="./alpine/index.html" target="_blank" rel="noopener">open standalone ↗</a></div>
            <iframe src="./alpine/index.html" title="Alpine lane"></iframe>
        </div>
        <div class="lane">
            <div class="lane-title">Svelte lane <a href="./svelte/dist/index.html" target="_blank" rel="noopener">open standalone ↗</a></div>
            <iframe src="./svelte/dist/index.html" title="Svelte lane"></iframe>
        </div>
    </div>
</body>
</html>
