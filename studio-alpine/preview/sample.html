<article class="rounded-md bg-secondary p-md" x-data="{ open: false, title: &quot;An overlay card&quot; }">
    <img data-anchor="photo" data-morph="card-photo" src="/media/example.jpg" alt="An example photo">
    <h2 data-anchor="title">An overlay card</h2>
    
    <div class="scrim" x-show="open" x-cloak></div>
    
    
    <dl>
        
        <dt>Does it morph?</dt>
        <dd><p>It does.</p>
</dd>
        
    </dl>
    
    <button x-on:click="open = !open" x-bind:aria-expanded="open">Details</button>
</article>
